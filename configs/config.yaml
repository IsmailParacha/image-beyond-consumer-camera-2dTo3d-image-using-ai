# === 1. General Project Settings ===
PROJECT: 'ImageClassification_v1'
TASK: 'classification'
SEED: 42 # For reproducibility (ensures random operations yield the same result)
# GPU is available
DEVICE: 'cuda' # Use 'cpu' if no GPU is available

# === 2. Data Paths and Setup ===
DATA:
  ROOT_DIR: 'E:\Imge beyound consumer camera\image-beyond-consumer-camera-2dTo3d-image-using-ai\' # E.g., /home/user/my_project/data/
  TRAIN_DIR: 'data\train' # Relative path inside ROOT_DIR
  VAL_DIR: 'data\val'
  TEST_DIR: 'data\test'
  NUM_CLASSES: 1 # Total number of categories
  IMG_SIZE: 128 # Standard input size for many CNNs (224x224)
  CHANNELS: 3 # 3 for RGB images

# === 3. Model Architecture ===
MODEL:
  NAME: 'resnet50'
  PRETRAINED: True # Start with weights trained on ImageNet
  FREEZE_LAYERS: False # Keep feature extractor frozen or train the whole model

# === 4. Training Hyperparameters ===
TRAIN:
  EPOCHS: 30
  BATCH_SIZE: 8
  LEARNING_RATE: 0.001
  OPTIMIZER: 'Adam' # Common choice: Adam, SGD, or AdamW
  WEIGHT_DECAY: 1e-4 # L2 regularization

# === 5. Augmentation Settings (Albumentations) ===
AUGMENTATION:
  PROBABILITY: 0.5 # Probability to apply an augmentation
  FLIP: True
  COLOR_JITTER: True
  RANDOM_ROTATION: 15 # Degrees for rotation

# === 6. Logging and Checkpointing ===
LOGS:
  SAVE_DIR: 'checkpoints/'
  LOG_INTERVAL: 10 # Log metrics every 10 batches
  WANDB_TRACKING: True # Use wandb for tracking (as per your dependencies)